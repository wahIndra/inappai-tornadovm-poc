server:
  port: ${PORT:8080}

spring:
  application:
    name: inapp-ai-agent
  mvc:
    async:
      request-timeout: 10m

llm:
  model-path: ${LLM_MODEL_PATH:models/Llama-3.2-1B-Instruct-FP16.gguf}
  on-gpu: ${LLM_ON_GPU:true}
  temperature: 0.7
  top-p: 0.95
  max-tokens: 1024
  seed: 42
  memory-messages: 8
  queue-capacity: 8
  request-timeout: 5m

logging:
  level:
    id.poc.inappai: INFO
